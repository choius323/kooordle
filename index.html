<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>오늘의 단어</title>
<script>
// 화면이 그려지기 전에 테마를 정해서 깜빡임을 막음
(function () {
  let t = null;
  try { t = localStorage.getItem('kordle_theme'); } catch (e) {}
  if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.dataset.theme = t;
})();
</script>
<style>
:root{--accent:#3B6FE0;--on-accent:#fff;--head:#3B6FE0;--on-head:#fff;--bg:#f5f5f5;--card:#fff;--fg:#1a1a1a;--sub:#888;--faint:#aaa;--label:#555;--line:#D3D6DA;--line-f:#888;--key:#fff;--kbbg:#EDEDEF;--box:#f7f7f7;--input:#ccc;--status:#2A4FA8;--toast:#333;color-scheme:light}
[data-theme=dark]{--accent:#4A78E0;--on-accent:#fff;--head:#1A2440;--on-head:#A9C0FF;--bg:#0e0e0f;--card:#121213;--fg:#e8e8e8;--sub:#9a9a9a;--faint:#6f6f6f;--label:#b5b5b5;--line:#3A3A3C;--line-f:#7a7a7c;--key:#4A4B4F;--kbbg:#1F1F21;--box:#1e1e20;--input:#3A3A3C;--status:#A9C0FF;--toast:#e8e8e8;color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--fg);display:flex;justify-content:center}
.app{width:100%;max-width:420px;min-height:100vh;background:var(--card);display:flex;flex-direction:column}
header{position:relative;background:var(--head);color:var(--on-head);text-align:center;padding:14px;font-size:19px;font-weight:700}
.theme{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;border-radius:50%;background:transparent;font-size:18px;line-height:1;cursor:pointer}
.date{text-align:center;color:var(--sub);font-size:13px;margin:12px 0}
.board{display:grid;gap:6px;padding:0 16px;margin:0 auto;width:100%}
.row{display:grid;gap:6px}
.tile{aspect-ratio:1;border:2px solid var(--line);border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:700}
.tile.f{border-color:var(--line-f)}
.g{background:#6AAA64!important;border-color:#6AAA64!important;color:#fff!important}
.y{background:#C9B458!important;border-color:#C9B458!important;color:#fff!important}
.x{background:#787C7E!important;border-color:#787C7E!important;color:#fff!important}
[data-theme=dark] .g{background:#538D4E!important;border-color:#538D4E!important}
[data-theme=dark] .y{background:#B59F3B!important;border-color:#B59F3B!important}
[data-theme=dark] .x{background:#3A3A3C!important;border-color:#3A3A3C!important}
[data-theme=dark] a{color:#8ab4f8}
.status{text-align:center;font-weight:700;color:var(--status);margin:14px 0;min-height:22px}
.kb{margin-top:auto;padding:12px 8px calc(16px + env(safe-area-inset-bottom));width:100%;background:var(--kbbg)}
/* 9칸 기준 고정 폭: 모든 자소 키와 지우기 키가 같은 크기, 짧은 줄은 가운데 정렬 */
.kr{display:flex;justify-content:center;gap:6px;max-width:400px;margin:0 auto 8px}
.k{flex:0 0 calc((100% - 48px) / 9);min-width:0;padding:0;height:50px;border:0;border-radius:8px;background:var(--key);font-size:18px;font-weight:700;color:var(--fg);touch-action:manipulation;box-shadow:0 1px 0 rgba(0,0,0,.12)}
.k.enter{flex:1 1 auto;height:50px;margin-top:4px;border-radius:10px;font-size:16px;background:var(--accent);color:var(--on-accent)}
.kr:last-child{margin-bottom:0}
/* 키보드의 '없음' 키: 두 모드 모두 원래 키를 흐리게 해서 배경에 묻히게 함 (흐려짐 = 쓸 일 없음) */
.k.x{background:var(--key)!important;color:var(--fg)!important;opacity:.28;box-shadow:none}
.btn{display:block;width:calc(100% - 32px);margin:8px auto;padding:13px;border:0;border-radius:8px;background:var(--accent);color:var(--on-accent);font-size:16px;font-weight:700}
.src{text-align:center;font-size:11px;color:var(--faint);margin:6px 0}
.maker{padding:20px 16px}
.maker label{display:block;font-size:14px;margin:14px 0 6px;color:var(--label)}
.maker input{width:100%;padding:12px;font-size:17px;border:1px solid var(--input);border-radius:8px;background:var(--card);color:var(--fg)}
.maker input[type=date]{color:var(--label)}
[data-theme=dark] .maker input[type=date]::-webkit-calendar-picker-indicator{opacity:.6}
.out{margin-top:16px;padding:12px;background:var(--box);border-radius:8px;word-break:break-all;font-size:14px;line-height:1.7}
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:var(--toast);color:var(--card);padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="app">
  <header>오늘의 단어<button class="theme" id="theme" aria-label="다크 모드 전환"></button></header>

  <div id="game" class="hidden">
    <div class="date" id="date"></div>
    <div class="board" id="board"></div>
    <div class="status" id="status"></div>
    <button class="btn hidden" id="share">결과 공유하기</button>
    <div class="src">출처: 국립국어원 우리말샘</div>
  </div>

  <div id="maker" class="maker hidden">
    <label>정답 단어 (한글)</label>
    <input id="mw" placeholder="예: 라이벌" autocomplete="off">
    <label>날짜</label>
    <input id="md" type="date">
    <button class="btn" style="width:100%;margin:16px 0 0" id="mk">문제 링크 만들기</button>
    <div class="out hidden" id="out"></div>
  </div>

  <div class="kb hidden" id="kb"></div>
</div>
<div class="toast" id="toast"></div>

<script>
// ===== 자모 분리 =====
const CHO = [...'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ'];
const JUNG = [...'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ'];
const JONG = ['', ...'ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ'];
const SPLIT = {
  'ㄲ':'ㄱㄱ','ㄸ':'ㄷㄷ','ㅃ':'ㅂㅂ','ㅆ':'ㅅㅅ','ㅉ':'ㅈㅈ',
  'ㅐ':'ㅏㅣ','ㅒ':'ㅑㅣ','ㅔ':'ㅓㅣ','ㅖ':'ㅕㅣ','ㅘ':'ㅗㅏ','ㅙ':'ㅗㅏㅣ','ㅚ':'ㅗㅣ',
  'ㅝ':'ㅜㅓ','ㅞ':'ㅜㅓㅣ','ㅟ':'ㅜㅣ','ㅢ':'ㅡㅣ',
  'ㄳ':'ㄱㅅ','ㄵ':'ㄴㅈ','ㄶ':'ㄴㅎ','ㄺ':'ㄹㄱ','ㄻ':'ㄹㅁ','ㄼ':'ㄹㅂ','ㄽ':'ㄹㅅ',
  'ㄾ':'ㄹㅌ','ㄿ':'ㄹㅍ','ㅀ':'ㄹㅎ','ㅄ':'ㅂㅅ'
};
const sp = j => [...(SPLIT[j] || j)];

function toJamo(w) {
  const o = [];
  for (const ch of w) {
    const c = ch.charCodeAt(0) - 0xAC00;
    if (c < 0 || c > 11171) return null;
    o.push(...sp(CHO[Math.floor(c / 588)]), ...sp(JUNG[Math.floor(c % 588 / 28)]));
    if (c % 28) o.push(...sp(JONG[c % 28]));
  }
  return o;
}

// ===== 문제 코드 인코딩/디코딩 (62진법) =====
const B = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
const en = (n, l) => { let s = ''; for (let i = 0; i < l; i++) { s = B[n % 62] + s; n = Math.floor(n / 62); } return s; };
const de = s => { let n = 0; for (const c of s) { const i = B.indexOf(c); if (i < 0) return NaN; n = n * 62 + i; } return n; };
const E0 = Date.UTC(2025, 0, 1), S = 11172;
const dayOf = str => { const [y, m, d] = str.split('-').map(Number); return Math.round((Date.UTC(y, m - 1, d) - E0) / 864e5); };
const dateOf = n => { const t = new Date(E0 + n * 864e5); return `${t.getUTCFullYear()}년 ${t.getUTCMonth() + 1}월 ${t.getUTCDate()}일`; };

function encode(word, dateStr) {
  const j = toJamo(word), day = dayOf(dateStr);
  if (!j || j.length > 61 || !(day >= 0 && day <= 3843)) return null;
  let sum = j.length + day, body = '';
  [...word].forEach((ch, i) => {
    const c = ch.charCodeAt(0) - 0xAC00;
    sum += c;
    body += en((c + 1237 * (i + 1) + 97 * day) % S, 3);
  });
  return en(j.length, 1) + en(day, 2) + body + en(sum % 62, 1);
}

function decode(q) {
  if (!q || q.length < 7 || (q.length - 4) % 3) return null;
  const len = de(q[0]), day = de(q.slice(1, 3));
  if (isNaN(len) || isNaN(day)) return null;
  let w = '', sum = len + day;
  for (let i = 0; i < (q.length - 4) / 3; i++) {
    const v = de(q.substr(3 + i * 3, 3));
    if (isNaN(v) || v >= S) return null;
    const c = (((v - 1237 * (i + 1) - 97 * day) % S) + S) % S;
    sum += c;
    w += String.fromCharCode(0xAC00 + c);
  }
  if (de(q.slice(-1)) !== sum % 62) return null;
  const j = toJamo(w);
  if (!j || j.length !== len) return null;
  return { word: w, jamo: j, day };
}

// ===== 공통 유틸 =====
const $ = id => document.getElementById(id);

// ===== 다크 모드 =====
function setTheme(t, save) {
  document.documentElement.dataset.theme = t;
  $('theme').textContent = t === 'dark' ? '☀️' : '🌙';
  if (save) { try { localStorage.setItem('kordle_theme', t); } catch (e) {} }
}
setTheme(document.documentElement.dataset.theme, false);
$('theme').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark', true);

function toast(m) {
  const t = $('toast');
  t.textContent = m;
  t.classList.add('on');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('on'), 1800);
}

function copy(t, msg) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(t)
      .then(() => toast(msg || '복사했어요'))
      .catch(() => prompt('복사해 주세요', t));
  } else {
    prompt('복사해 주세요', t);
  }
}

// ===== 게임 상태 =====
const KB = [
  [...'ㅂㅈㄷㄱㅅㅛㅕㅑ', '지우기'],
  [...'ㅁㄴㅇㄹㅎㅗㅓㅏㅣ'],
  [...'ㅋㅌㅊㅍㅠㅜㅡ'],
  ['입력']
];
const LABEL = { '지우기': '←' };
const KEYS = new Set(KB.flat().filter(k => k.length === 1));
const QW = {
  q:'ㅂ', w:'ㅈ', e:'ㄷ', r:'ㄱ', t:'ㅅ', y:'ㅛ', u:'ㅕ', i:'ㅑ',
  a:'ㅁ', s:'ㄴ', d:'ㅇ', f:'ㄹ', g:'ㅎ', h:'ㅗ', j:'ㅓ', k:'ㅏ', l:'ㅣ',
  z:'ㅋ', x:'ㅌ', c:'ㅊ', v:'ㅍ', b:'ㅠ', n:'ㅜ', m:'ㅡ'
};
const MAX = 5, RANK = { x: 1, y: 2, g: 3 };
let P = null, N = 0, rows = [], cur = [], done = false, win = false;
let tiles = [], keyEl = {}, keyState = {};
let DICT = null, DICT_OFF = false;
const q = new URLSearchParams(location.search).get('q');
const SKEY = 'kordle_' + q;

// ===== 사전 불러오기 =====
function loadDict() {
  fetch(`dict/${N}.txt`)
    .then(r => { if (!r.ok) throw 0; return r.text(); })
    .then(t => {
      const s = new Set([P.jamo.join('')]);
      t.split('\n').forEach(w => {
        const j = toJamo(w.trim());
        if (j && j.length === N) s.add(j.join(''));
      });
      DICT = s;
    })
    .catch(() => { DICT_OFF = true; toast('사전 없이 진행해요'); });
}

// ===== 출제 화면 =====
function showMaker() {
  $('maker').classList.remove('hidden');
  const t = new Date(), p = n => String(n).padStart(2, '0');
  $('md').value = `${t.getFullYear()}-${p(t.getMonth() + 1)}-${p(t.getDate())}`;
  // 결과: true(사전에 있음) / false(사전에 없음) / null(사전을 못 읽음 → 제한 없이 허용)
  const cache = {};
  const inDict = w => {
    const n = toJamo(w).length;
    cache[n] = cache[n] || fetch(`dict/${n}.txt`)
      .then(r => { if (!r.ok) throw 0; return r.text(); })
      .then(t => new Set(t.split(/\r?\n/).map(x => x.trim())))
      .catch(() => { delete cache[n]; return null; });
    return cache[n].then(set => set ? set.has(w) : null);
  };
  $('mk').onclick = async () => {
    const w = $('mw').value.trim();
    if (!/^[가-힣]+$/.test(w)) { toast('한글 단어만 입력해 주세요'); return; }
    const ok = await inDict(w);
    if (ok === false) { toast('사전에 없는 단어예요'); return; }
    if (ok === null) toast('사전 없이 출제해요');
    const code = encode(w, $('md').value);
    if (!code) { toast('단어나 날짜를 확인해 주세요'); return; }
    const link = location.origin + location.pathname + '?q=' + code;
    const o = $('out');
    o.classList.remove('hidden');
    o.innerHTML = `자모 ${toJamo(w).length}개 · 코드 <b>${code}</b><br><a href="${link}">${link}</a>` +
      `<button class="btn" style="width:100%;margin:10px 0 0" id="cp">링크 복사</button>`;
    $('cp').onclick = () => copy(link, '링크를 복사했어요');
  };
}

// ===== 채점 =====
function score(g) {
  const a = P.jamo, res = Array(N).fill('x'), cnt = {};
  for (let i = 0; i < N; i++) {
    if (g[i] === a[i]) res[i] = 'g';
    else cnt[a[i]] = (cnt[a[i]] || 0) + 1;
  }
  for (let i = 0; i < N; i++) {
    if (res[i] !== 'g' && cnt[g[i]] > 0) { res[i] = 'y'; cnt[g[i]]--; }
  }
  return res;
}

function commit(g, save) {
  const res = score(g);
  rows.push({ g: [...g], res });
  g.forEach((j, i) => {
    if ((RANK[res[i]] || 0) > (RANK[keyState[j]] || 0)) keyState[j] = res[i];
  });
  if (res.every(v => v === 'g')) { done = true; win = true; }
  else if (rows.length >= MAX) done = true;
  if (save) {
    try { localStorage.setItem(SKEY, JSON.stringify({ rows: rows.map(r => r.g) })); } catch (e) {}
  }
}

// ===== 입력 처리 =====
function press(k) {
  if (done) return;
  if (k === '입력') {
    if (cur.length < N) { toast(`자모 ${N}개를 모두 입력해 주세요`); return; }
    if (!DICT_OFF) {
      if (!DICT) { toast('사전을 불러오는 중이에요'); return; }
      if (!DICT.has(cur.join(''))) { toast('사전에 없는 단어예요'); return; }
    }
    commit(cur, true);
    cur = [];
  } else if (k === '지우기') {
    cur.pop();
  } else if (cur.length < N) {
    cur.push(k);
  }
  render();
}

// ===== 화면 그리기 =====
// 값이 실제로 바뀔 때만 DOM을 건드림.
// 광고 차단 확장(유니콘 등)은 DOM이 바뀔 때마다 페이지를 검사하므로, 변경 횟수가 곧 입력 딜레이가 됨.
function setEl(el, text, cls) {
  if (el._t !== text) { el.textContent = text; el._t = text; }
  if (el._c !== cls) { el.className = cls; el._c = cls; }
}

function render() {
  for (let r = 0; r < MAX; r++) {
    for (let c = 0; c < N; c++) {
      const t = tiles[r][c];
      if (r < rows.length) setEl(t, rows[r].g[c], 'tile ' + rows[r].res[c]);
      else if (r === rows.length && !done) setEl(t, cur[c] || '', 'tile' + (cur[c] ? ' f' : ''));
      else setEl(t, '', 'tile');
    }
  }
  for (const k in keyEl) {
    const b = keyEl[k];
    const cls = 'k' + (k === '입력' ? ' enter' : '') + (keyState[k] ? ' ' + keyState[k] : '');
    if (b._c !== cls) { b.className = cls; b._c = cls; }
  }
  const st = $('status');
  setEl(st, done
    ? (win ? `${rows.length}/${MAX} 정답! (${P.word})` : `아쉬워요, 정답은 '${P.word}'`)
    : `${rows.length}/${MAX} 도전 중`, st.className);
  const sh = $('share');
  if (sh.classList.contains('hidden') === done) sh.classList.toggle('hidden', !done);
}

// ===== 게임 시작 =====
function startGame() {
  N = P.jamo.length;
  loadDict();
  $('game').classList.remove('hidden');
  $('kb').classList.remove('hidden');
  $('date').textContent = dateOf(P.day);

  // 보드 만들기
  const board = $('board');
  board.style.maxWidth = Math.min(N * 54 + 32, 420) + 'px';
  for (let r = 0; r < MAX; r++) {
    const row = document.createElement('div');
    row.className = 'row';
    row.style.gridTemplateColumns = `repeat(${N},1fr)`;
    tiles[r] = [];
    for (let c = 0; c < N; c++) {
      const t = document.createElement('div');
      t.className = 'tile';
      t.style.fontSize = (N > 8 ? 16 : 20) + 'px';
      row.appendChild(t);
      tiles[r].push(t);
    }
    board.appendChild(row);
  }

  // 화면 키보드 만들기
  KB.forEach((line, r) => {
    const kr = document.createElement('div');
    kr.className = 'kr';
    line.forEach((k, i) => {
      const b = document.createElement('button');
      b.className = 'k' + (k === '입력' ? ' enter' : '');
      b.textContent = LABEL[k] || k;
      if (LABEL[k]) b.setAttribute('aria-label', k);
      // 손가락이 닿는 순간 입력(click은 손을 뗀 뒤에야 발생). 키보드 접근(Enter/Space)은 click으로 처리
      b.onpointerdown = e => { if (e.button === 0) { e.preventDefault(); press(k); } };
      b.onclick = e => { if (e.detail === 0) press(k); };
      kr.appendChild(b);
      keyEl[k] = b;
    });
    $('kb').appendChild(kr);
  });

  // 이전 진행 기록 불러오기
  try {
    const s = JSON.parse(localStorage.getItem(SKEY));
    if (s && Array.isArray(s.rows)) {
      s.rows.forEach(g => { if (!done && g.length === N) commit(g, false); });
    }
  } catch (e) {}

  // 결과 공유
  $('share').onclick = () => {
    const em = { g: '🟩', y: '🟨', x: '⬜' };
    const lines = rows.map(r => r.res.map(v => em[v]).join('')).join('\n');
    const text = `오늘의 단어 ${dateOf(P.day)} ${win ? rows.length : 'X'}/${MAX}\n${lines}\n${location.href}`;
    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
      || matchMedia('(pointer:coarse)').matches;

    if (isMobile && navigator.share) {
      // 휴대폰: 공유 창 (카톡 등 선택)
      navigator.share({ text }).catch(e => {
        if (e.name !== 'AbortError') copy(text, '결과를 복사했어요');
      });
    } else {
      // PC: 클립보드에 복사
      copy(text, '결과를 복사했어요');
    }
  };

  // PC 키보드 입력 (영문 자판 → 한글 자모)
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') press('입력');
    else if (e.key === 'Backspace') press('지우기');
    else {
      const k = QW[e.key.toLowerCase()] || e.key;
      if (KEYS.has(k)) press(k);
    }
  });

  render();
}

// ===== 시작점 =====
if (q) {
  P = decode(q);
  if (P) startGame();
  else { showMaker(); toast('잘못된 문제 코드예요'); }
} else {
  showMaker();
}
